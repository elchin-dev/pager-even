<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Pager</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 340px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      .muted {
        margin: 0 0 16px;
        color: #A3A3A3;
      }
      .code {
        margin: 0 0 18px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #171717;
        border: 1px solid #383838;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #FFFFFF;
      }
      .btn {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 16px;
        border-radius: 10px;
        border: none;
        background: #FFFFFF;
        color: #171717;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .status {
        margin: 14px 0 0;
        font-size: 13px;
        color: #A3A3A3;
      }
    </style>
  </head>
  <body>
    <div id="app">Connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
